<!DOCTYPE html>

<html class="h-full bg-slate-50" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
<title>ASHA Healthcare - Frontline Worker Login</title>
<!-- Google Fonts for crisp, highly legible medical UI typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7fc',
              100: '#e0f0f9',
              500: '#0284c7',
              600: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              dark: '#0a2540',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="base-enhancements">
    /* Smooth iOS scrolling and responsive default setup */
    html {
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased bg-slate-50 min-h-screen flex flex-col justify-between py-6 px-4 sm:px-6 lg:px-8">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-md mx-auto my-auto flex flex-col items-center" data-purpose="login-container">
<!-- BEGIN: HeaderSection -->
<header class="w-full flex flex-col items-center text-center mb-6" data-purpose="brand-header">
<!-- Centered Official Logo -->
<div class="w-48 sm:w-52 h-20 flex items-center justify-center overflow-hidden mb-3">
<img alt="ASHA Healthcare Logo" class="w-full h-full object-contain mix-blend-multiply" loading="eager" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALXb8-ZL-_eGUKDvQcUcNNJxJzM6Aq7V4gKLj0EgzAA7QB3ATkKZ4-u8HUW_imnQr52LWUNUX0oA0z8QR2ss6X5j6G6C6dvZZFQV3hGEO2iSluuv53moiXqgsyYYxliGLRnhHcFSX-5vKggCHkPRuYfQ2MZNvxTYuhLXbWP8dyaJjqjSxgfwehiW9sQD1c6_WnOTvGzTCCbNA2fz52DfL7NCIC6nsyajzec-7T4fWrnt5fCwhGxmPpZKGiaj_y_rVIUbM"/>
</div>
<!-- Portal Status Badge -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-100/80 text-brand-900 border border-sky-200/70 text-xs font-semibold tracking-wide uppercase mb-3">
<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Frontline Worker Portal
      </div>
<h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
        Welcome back
      </h1>
<p class="mt-1.5 text-sm text-slate-600 max-w-xs leading-relaxed">
        Sign in with your Worker ID or Mobile Number to begin field duties.
      </p>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: LoginCard -->
<section class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/90 p-6 sm:p-8" data-purpose="login-card">
<form action="#" class="space-y-5" method="POST" onsubmit="event.preventDefault();">
<!-- Input 1: Worker ID / Mobile Number -->
<div data-purpose="field-identifier">
<label class="block text-sm font-semibold text-slate-800 mb-1.5" for="workerId">
            Worker ID or Mobile Number
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<!-- Identification Badge / User Icon -->
<svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input autocomplete="username" class="block w-full rounded-xl border border-slate-300 pl-10 pr-3.5 py-3 text-slate-900 placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-base transition-colors" id="workerId" inputmode="text" name="workerId" placeholder="e.g. ASHA-9021 or 10-digit mobile" required="" type="text"/>
</div>
</div>
<!-- Input 2: Security PIN or Password -->
<div data-purpose="field-pin">
<div class="flex items-center justify-between mb-1.5">
<label class="block text-sm font-semibold text-slate-800" for="securityPin">
              Security PIN / Password
            </label>
<a class="text-xs font-semibold text-brand-600 hover:text-brand-800 transition-colors" href="#help">
              Forgot PIN?
            </a>
</div>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<!-- Lock Icon -->
<svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input autocomplete="current-password" class="block w-full rounded-xl border border-slate-300 pl-10 pr-11 py-3 text-slate-900 placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-base transition-colors" id="securityPin" inputmode="numeric" name="securityPin" placeholder="Enter your 4 or 6-digit PIN" required="" type="password"/>
<!-- Toggle PIN visibility button -->
<button aria-label="Toggle PIN Visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" id="togglePinVisibility" type="button">
<svg class="w-5 h-5" fill="none" id="eyeIcon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Quick Preferences: Remember on device -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer select-none">
<input checked="" class="h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 focus:ring-offset-0" name="rememberDevice" type="checkbox"/>
<span>Remember me on this phone</span>
</label>
</div>
<!-- Primary Action Button -->
<button class="w-full min-h-[48px] bg-brand-dark hover:bg-slate-900 text-white font-semibold text-base py-3 px-5 rounded-xl shadow transition-all duration-150 active:scale-[0.99] flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-brand-dark focus:ring-offset-2" type="submit">
<span>Sign In &amp; Sync</span>
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Divider with Text -->
<div class="relative py-1">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white px-2.5 text-slate-400 font-medium">Or</span>
</div>
</div>
<!-- Secondary Option: Login with SMS OTP -->
<button class="w-full min-h-[44px] bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium text-sm py-2.5 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-slate-300" type="button">
<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Log In via Mobile OTP</span>
</button>
</form>
<!-- Offline Readiness Indicator -->
<div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-500 text-center">
<svg class="w-4 h-4 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Offline mode ready • Your work will sync automatically</span>
</div>
</section>
<!-- END: LoginCard -->
</main>
<!-- END: MainContainer -->
<!-- BEGIN: FooterHelpSection -->
<footer class="w-full max-w-md mx-auto text-center mt-6 pt-2 pb-2" data-purpose="footer-support">
<div class="space-y-2">
<p class="text-xs sm:text-sm text-slate-600">
        Need help? Contact Sector Supervisor or 
        <a class="font-semibold text-brand-600 hover:text-brand-800 underline decoration-sky-300 underline-offset-2" href="tel:180027424357">
          Call 1800-ASHA-HELP
        </a>
</p>
<p class="text-[11px] text-slate-400 tracking-normal">
        © 2026 ASHA Healthcare • Secure Field System
      </p>
</div>
</footer>
<!-- END: FooterHelpSection -->
<!-- Password toggle script -->
<script data-purpose="pin-visibility-toggle">
    const toggleBtn = document.getElementById('togglePinVisibility');
    const pinInput = document.getElementById('securityPin');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pinInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = pinInput.getAttribute('type') === 'password';
        if (isPassword) {
          pinInput.setAttribute('type', 'text');
          // Update icon to eye-off
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          `;
        } else {
          pinInput.setAttribute('type', 'password');
          // Update icon back to eye
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          `;
        }
      });
    }
  </script>
</body></html>
