<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-secondary-container": "#0b6f63", "surface": "#f9f9fd", "background": "#f9f9fd", "secondary-container": "#9cefdf", "emergency-red": "#BA1A1A", "on-tertiary": "#ffffff", "on-primary-fixed": "#001c37", "on-surface": "#1a1c1f", "surface-container-lowest": "#ffffff", "primary-fixed-dim": "#a3c9fc", "surface-container": "#eeedf2", "error": "#ba1a1a", "on-primary": "#ffffff", "error-container": "#ffdad6", "on-tertiary-container": "#d38b5c", "sync-offline": "#727780", "primary": "#001f3c", "ai-purple": "#3F0099", "on-primary-container": "#799fcf", "surface-variant": "#e2e2e6", "on-secondary": "#ffffff", "primary-container": "#00355f", "admin-amber": "#B45309", "tertiary-fixed": "#ffdbc7", "outline-variant": "#c3c6d0", "surface-container-highest": "#e2e2e6", "surface-container-high": "#e8e8ec", "secondary-fixed-dim": "#83d5c6", "secondary-fixed": "#9ff2e2", "surface-bright": "#f9f9fd", "tertiary-container": "#562600", "on-secondary-fixed": "#00201c", "tertiary": "#361500", "inverse-primary": "#a3c9fc", "primary-fixed": "#d2e4ff", "on-error-container": "#93000a", "on-surface-variant": "#42474f", "tertiary-fixed-dim": "#ffb689", "on-secondary-fixed-variant": "#005047", "outline": "#73777f", "on-background": "#1a1c1f", "on-primary-fixed-variant": "#1e4973", "surface-tint": "#39608d", "inverse-on-surface": "#f1f0f4", "on-error": "#ffffff", "surface-dim": "#dadade", "surface-container-low": "#f4f3f7", "on-tertiary-fixed": "#311300", "secondary": "#006b5f", "on-tertiary-fixed-variant": "#6e3910", "inverse-surface": "#2f3034" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "touch-target": "48px", "margin-desktop": "40px", "gutter-md": "20px", "margin-mobile": "16px", "gutter-sm": "12px", "unit": "4px" }, "fontFamily": { "body-lg": ["Inter"], "label-sm": ["Geist"], "headline-lg": ["Geist"], "headline-md": ["Geist"], "headline-lg-mobile": ["Geist"], "display-lg": ["Geist"], "label-md": ["Geist"], "body-md": ["Inter"] }, "fontSize": { "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }] } } } }</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../asha-navigation.css">
</head>

<body class="bg-background font-body-md text-on-background">
    <main class="relative w-full min-h-screen">
        <div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
            <div class="absolute inset-0 opacity-10 pointer-events-none">
                <svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern height="40" id="grid-pattern" patternUnits="userSpaceOnUse" width="40">
                            <path class="text-primary/20" d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor"
                                stroke-width="0.5"></path>
                        </pattern>
                    </defs>
                    <rect fill="url(#grid-pattern)" height="100%" width="100%"></rect>
                </svg>
            </div>
            <div
                class="px-margin-mobile flex-1 flex flex-col justify-center max-w-lg mx-auto w-full z-10 py-8 relative">
                <button onclick="window.history.back()"
                    class="absolute top-4 left-margin-mobile w-[44px] h-[44px] flex items-center justify-center bg-surface-container rounded-full shadow-sm hover:bg-on-surface-variant/5 active:scale-95 transition-all text-on-surface-variant z-20 cursor-pointer">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
                <!-- Connectivity Status Banner -->
                <div class="absolute top-4 left-margin-mobile right-margin-mobile">
                    <div class="bg-surface-container rounded-full p-2 flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-2 px-3">
                            <span class="w-2 h-2 rounded-full bg-sync-offline animate-pulse"></span>
                            <span class="font-label-sm text-on-surface-variant">Low Connectivity Detected</span>
                        </div>
                        <button
                            class="bg-surface-variant hover:bg-surface-container-high transition-colors text-on-surface-variant font-label-sm px-4 py-1.5 rounded-full flex items-center gap-1">
                            <span class="material-symbols-outlined text-[16px]">wifi_off</span>
                            Offline Mode
                        </button>
                    </div>
                </div>
                <div class="text-center mb-10 mt-16">
                    <div
                        class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mx-auto mb-6 shadow-md shadow-primary/20">
                        <span class="material-symbols-outlined text-on-primary text-[32px]">health_and_safety</span>
                    </div>
                    <h1 class="font-display-lg text-headline-lg-mobile text-on-background mb-2">Patient Access</h1>
                    <p class="font-body-md text-on-surface-variant">Secure entry to your health records</p>
                </div>
                <!-- Language Selector -->
                <div class="mb-8 flex justify-center">
                    <div
                        class="bg-surface-container-low rounded-lg p-1 flex shadow-sm border border-outline-variant/30">
                        <button
                            class="px-4 py-2 bg-surface text-on-surface font-label-md rounded shadow-sm transition-all">English</button>
                        <button
                            class="px-4 py-2 text-on-surface-variant font-label-md rounded hover:bg-surface-container transition-all">हिंदी</button>
                        <button
                            class="px-4 py-2 text-on-surface-variant font-label-md rounded hover:bg-surface-container transition-all">मराठी</button>
                    </div>
                </div>
                <!-- Alert Box -->
                <div id="patient-auth-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold text-center"></div>

                <!-- 1-Click Fast Patient Access -->
                <div class="mb-6 p-4 rounded-2xl bg-primary/5 border border-primary/20 flex flex-col gap-3 text-center shadow-sm">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-primary uppercase tracking-wider">Demo Patient Account</span>
                        <span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-[10px] font-bold">Verified ABHA</span>
                    </div>
                    <div class="text-left text-xs text-on-surface-variant">
                        <strong>Priya Sharma</strong> (Age 28, Kalyanpur)<br/>
                        <span class="text-[11px] opacity-75 font-mono">patient@asha.org • ABHA-9821-4321-0012</span>
                    </div>
                    <button id="demo-patient-btn" onclick="loginPatient()" class="w-full py-3 bg-primary text-on-primary rounded-xl font-headline-md text-sm font-semibold flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-md">
                        <span class="material-symbols-outlined text-[18px]">verified_user</span> Enter Patient Portal
                    </button>
                </div>

                <!-- Login Options Bento Grid -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <!-- Mobile Login (Primary) -->
                    <button onclick="loginPatient()"
                        class="col-span-2 bg-surface-container-high text-on-surface rounded-xl p-4 flex items-center justify-between border border-outline-variant/30 hover:border-primary active:scale-[0.98] transition-all min-h-[72px]">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary">
                                <span class="material-symbols-outlined text-[24px]">smartphone</span>
                            </div>
                            <div class="text-left">
                                <span class="block font-headline-md text-[16px] text-on-surface">Mobile Number</span>
                                <span class="block font-label-sm text-on-surface-variant opacity-80">+91 9876543210 (OTP)</span>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-primary">arrow_forward</span>
                    </button>
                    <!-- ABHA Login -->
                    <button onclick="loginPatient()"
                        class="bg-surface-container rounded-xl p-4 flex flex-col items-start gap-3 border border-outline-variant/30 hover:border-primary active:scale-[0.98] transition-all min-h-[110px]">
                        <div class="w-10 h-10 bg-surface rounded-full flex items-center justify-center shadow-sm">
                            <span class="material-symbols-outlined text-primary text-[20px]">badge</span>
                        </div>
                        <div class="text-left">
                            <span class="block font-label-md text-on-surface font-semibold">ABHA ID</span>
                            <span class="block font-label-sm text-on-surface-variant mt-0.5">Instant Sync</span>
                        </div>
                    </button>
                    <!-- QR / Offline -->
                    <button onclick="loginPatient()"
                        class="bg-surface-container rounded-xl p-4 flex flex-col items-start gap-3 border border-outline-variant/30 hover:border-primary active:scale-[0.98] transition-all min-h-[110px]">
                        <div class="w-10 h-10 bg-surface rounded-full flex items-center justify-center shadow-sm">
                            <span class="material-symbols-outlined text-primary text-[20px]">qr_code_scanner</span>
                        </div>
                        <div class="text-left">
                            <span class="block font-label-md text-on-surface font-semibold">Scan Card</span>
                            <span class="block font-label-sm text-on-surface-variant mt-0.5">Offline Access</span>
                        </div>
                    </button>
                </div>
                <div class="mt-auto pt-8 pb-4 text-center">
                    <span class="material-symbols-outlined text-on-surface-variant/50 text-[24px] mb-2">lock</span>
                    <p class="font-label-sm text-on-surface-variant max-w-[280px] mx-auto opacity-70">
                        Protected by BCrypt cryptographic hashing and ABHA national digital health standards.
                    </p>
                </div>
            </div>
        </div>

        <script>
            async function loginPatient() {
                const alertBox = document.getElementById('patient-auth-alert');
                const btn = document.getElementById('demo-patient-btn');
                
                alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-semibold bg-blue-50 text-blue-800 border border-blue-200 block';
                alertBox.textContent = 'Verifying ABHA credentials with BCrypt...';
                if (btn) btn.disabled = true;

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: 'patient@asha.org',
                            password: 'patient123'
                        })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-800 border border-red-200 block';
                        alertBox.textContent = data.error || 'Authentication error';
                        if (btn) btn.disabled = false;
                        return;
                    }

                    localStorage.setItem('asha_token', data.token);
                    localStorage.setItem('asha_user', JSON.stringify(data.user));

                    alertBox.className = 'mb-4 p-3 rounded-xl text-xs font-semibold bg-green-50 text-green-800 border border-green-200 block';
                    alertBox.textContent = `Welcome ${data.user.name}! Entering portal...`;

                    setTimeout(() => {
                        window.location.href = '../../patient/dashboard/index.html';
                    }, 500);
                } catch(err) {
                    window.location.href = '../../patient/dashboard/index.html';
                }
            }
        </script>
    </main>



    <script src="../../asha-navigation.js"></script>
</body>

</html>
